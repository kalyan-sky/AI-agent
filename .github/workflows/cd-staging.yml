name: CD (staging)

# Runs only after CI has gone green on main — never on an arbitrary
# branch or an unverified commit (see CLAUDE.md's deployment rules).
# workflow_run (not `push`) is what enforces that: this job only starts
# once the CI workflow *run for this exact commit* has completed, and the
# `if` below then requires it to have succeeded.
on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation — no JSON key involved

concurrency:
  group: cd-staging
  cancel-in-progress: false # never cancel a deploy that's already in flight

jobs:
  deploy:
    name: Build, push, and deploy to Cloud Run (staging)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Requires these repository (or "staging" environment) variables,
      # set once after `terraform apply` — see infrastructure/terraform's
      # outputs (github_actions_workload_identity_provider and
      # github_actions_service_account_email) for the first two:
      #   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT_EMAIL,
      #   GCP_PROJECT_ID, GCP_REGION
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push agent-service
        uses: docker/build-push-action@v6
        with:
          context: agent-service
          push: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ai-ops-agent/agent-service:${{ github.event.workflow_run.head_sha }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ai-ops-agent/agent-service:staging
          cache-from: type=gha,scope=agent-service
          cache-to: type=gha,mode=max,scope=agent-service

      - name: Build and push mock-enterprise
        uses: docker/build-push-action@v6
        with:
          context: mock-enterprise
          push: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ai-ops-agent/mock-enterprise:${{ github.event.workflow_run.head_sha }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ai-ops-agent/mock-enterprise:staging
          cache-from: type=gha,scope=mock-enterprise
          cache-to: type=gha,mode=max,scope=mock-enterprise

      - name: Deploy mock-enterprise
        id: deploy-mock-enterprise
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: mock-enterprise
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ai-ops-agent/mock-enterprise:${{ github.event.workflow_run.head_sha }}

      - name: Deploy agent-service
        id: deploy-agent-service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: agent-service
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ai-ops-agent/agent-service:${{ github.event.workflow_run.head_sha }}

      - name: Smoke test — /health on the deployed revision
        run: |
          curl -fsS "${{ steps.deploy-agent-service.outputs.url }}/health" | tee /dev/stderr | grep -q '"status":"ok"'
