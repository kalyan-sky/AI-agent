name: CI

on:
  push:
    branches: ["main", "dev", "feature-*"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-service:
    name: agent-service (lint + typecheck + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: aiops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiops -d aiops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aiops:devpassword@localhost:5432/aiops
      REDIS_URL: redis://localhost:6379/0
      QDRANT_LOCAL_PATH: /tmp/ci-qdrant
      EMBEDDING_PROVIDER: local-hash
      EMBEDDING_DIM: "64"
      MOCK_ENTERPRISE_BASE_URL: http://127.0.0.1:9
      JWT_SECRET_KEY: ci-test-secret-not-for-prod
      API_KEYS: ci-viewer-key:viewer,ci-operator-key:operator,ci-admin-key:admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-service/requirements*.txt

      - name: Install dependencies
        working-directory: agent-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run database migrations
        working-directory: agent-service
        run: alembic upgrade head

      - name: ruff
        working-directory: agent-service
        run: ruff check .

      - name: mypy
        working-directory: agent-service
        run: mypy app

      - name: pytest
        working-directory: agent-service
        run: pytest -q

  mock-enterprise:
    name: mock-enterprise (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mock-enterprise/requirements*.txt

      - name: Install dependencies
        working-directory: mock-enterprise
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff
        working-directory: mock-enterprise
        run: ruff check .

      - name: pytest
        working-directory: mock-enterprise
        run: pytest -q

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: [agent-service, mock-enterprise]
    strategy:
      matrix:
        service: [agent-service, mock-enterprise]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          tags: ai-ops-agent/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, no real credentials needed)
        working-directory: infrastructure/terraform
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate

  n8n-workflows:
    name: n8n workflow structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate workflow JSON structure
        run: python3 scripts/validate_n8n_workflows.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the custom n8n node (real tsc compile)
        working-directory: n8n/custom-nodes/n8n-nodes-aiops-agent
        run: |
          npm install
          npm run build
